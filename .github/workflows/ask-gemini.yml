name: Ask Gemini

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Paste your full task prompt"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Ask Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.8-flash
          prompt: ${{ inputs.prompt }}

      - name: Commit and push changes
        id: commit
        run: |
          rm -rf .gemini gha-creds-*.json
          git config user.name "gemini-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Gemini update"
          fi
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger APK build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
